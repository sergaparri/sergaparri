<section id="home" class="landing-hero">
  <div class="landing-hero__backdrop" aria-hidden="true">
    <div class="landing-hero__orb landing-hero__orb--large"></div>
    <div class="landing-hero__orb landing-hero__orb--soft"></div>
    <div class="landing-hero__dots"></div>
  </div>

  <div class="landing-hero__inner">
    <div class="landing-hero__copy reveal">
      <p class="landing-hero__eyebrow">HELLO, I&apos;M</p>
      <h1 class="landing-hero__title">
        <span>SERG</span>
        <span class="landing-hero__title-muted">APARRI</span>
      </h1>
      <p class="landing-hero__subtitle">UI/UX DESIGNER</p>
      <p class="landing-hero__text">
        I design clean, intuitive, and user-centered digital experiences that solve real problems
        and create a quiet sense of impact.
      </p>

      <div class="landing-hero__actions">
        <a class="button button-primary landing-hero__primary" href="#projects">View My Work</a>
        <a class="button button-text landing-hero__secondary" href="assets/documents/Aparri,Serg CV.docx" download>
          Download CV
        </a>
      </div>

      <ul class="landing-hero__stats" aria-label="Quick stats">
        <li class="landing-stat">
          <strong>2+</strong>
          <span>Years Experience</span>
        </li>
        <li class="landing-stat">
          <strong>15+</strong>
          <span>Projects Completed</span>
        </li>
        <li class="landing-stat landing-stat--theme">
          <button
            class="theme-toggle-card"
            type="button"
            data-theme-toggle
            aria-pressed="false"
            aria-label="Switch portfolio to light mode"
          >
            <svg
              class="theme-toggle-card__svg"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 200 200"
              aria-hidden="true"
              focusable="false"
            >
              <g class="theme-toggle-card__icon-layer">
                <polygon class="theme-toggle-card__bounce" transform="rotate(45 100 100)" stroke-width="1" stroke="#d3a410" fill="none" points="70,70 148,50 130,130 50,150"></polygon>
                <polygon class="theme-toggle-card__bounce theme-toggle-card__bounce--alt" transform="rotate(45 100 100)" stroke-width="1" stroke="#d3a410" fill="none" points="70,70 148,50 130,130 50,150"></polygon>
                <polygon transform="rotate(45 100 100)" stroke-width="2" fill="#414750" points="70,70 150,50 130,130 50,150"></polygon>
                <polygon stroke-width="2" fill="url(#theme-gradiente)" points="100,70 150,100 100,130 50,100"></polygon>
                <defs>
                  <linearGradient y2="100%" x2="10%" y1="0%" x1="0%" id="theme-gradiente">
                    <stop style="stop-color: #1e2026;stop-opacity:1" offset="20%"></stop>
                    <stop style="stop-color:#414750;stop-opacity:1" offset="60%"></stop>
                  </linearGradient>
                </defs>
                <polygon transform="translate(20, 31)" stroke-width="2" fill="#b7870f" points="80,50 80,75 80,99 40,75"></polygon>
                <polygon transform="translate(20, 31)" stroke-width="2" fill="url(#theme-gradiente2)" points="40,-40 80,-40 80,99 40,75"></polygon>
                <defs>
                  <linearGradient y2="100%" x2="0%" y1="-17%" x1="10%" id="theme-gradiente2">
                    <stop style="stop-color: #d3a51000;stop-opacity:1" offset="20%"></stop>
                    <stop style="stop-color:#d3a51054;stop-opacity:1" offset="100%"></stop>
                  </linearGradient>
                </defs>
                <polygon transform="rotate(180 100 100) translate(20, 20)" stroke-width="2" fill="#d3a410" points="80,50 80,75 80,99 40,75"></polygon>
                <polygon transform="rotate(0 100 100) translate(60, 20)" stroke-width="2" fill="url(#theme-gradiente3)" points="40,-40 80,-40 80,85 40,110.2"></polygon>
                <defs>
                  <linearGradient y2="100%" x2="10%" y1="0%" x1="0%" id="theme-gradiente3">
                    <stop style="stop-color: #d3a51000;stop-opacity:1" offset="20%"></stop>
                    <stop style="stop-color:#d3a51054;stop-opacity:1" offset="100%"></stop>
                  </linearGradient>
                </defs>
                <polygon class="theme-toggle-card__particle" transform="rotate(45 100 100) translate(80, 95)" stroke-width="2" fill="#ffe4a1" points="5,0 5,5 0,5 0,0"></polygon>
                <polygon class="theme-toggle-card__particle theme-toggle-card__particle--alt" transform="rotate(45 100 100) translate(80, 55)" stroke-width="2" fill="#ccb069" points="6,0 6,6 0,6 0,0"></polygon>
                <polygon class="theme-toggle-card__particle theme-toggle-card__particle--tiny" transform="rotate(45 100 100) translate(70, 80)" stroke-width="2" fill="#fff" points="2,0 2,2 0,2 0,0"></polygon>
                <polygon stroke-width="2" fill="#292d34" points="29.5,99.8 100,142 100,172 29.5,130"></polygon>
                <polygon transform="translate(50, 92)" stroke-width="2" fill="#1f2127" points="50,50 120.5,8 120.5,35 50,80"></polygon>
              </g>
            </svg>
            <span class="theme-toggle-card__copy">
              <span data-theme-hint>Light mode</span>
            </span>
          </button>
        </li>
      </ul>

      <div class="landing-hero__social" aria-label="Social links">
        <p>Follow me</p>
        <div class="landing-hero__social-links">
          <a class="hero-icon-link" href="https://github.com/sergaparri" target="_blank" rel="noreferrer" aria-label="GitHub">
            <i class="bi bi-github" aria-hidden="true"></i>
          </a>
          <a class="hero-icon-link" href="https://www.facebook.com/sergmichael.aparri" target="_blank" rel="noreferrer" aria-label="Facebook">
            <i class="bi bi-facebook" aria-hidden="true"></i>
          </a>
          <a class="hero-icon-link" href="https://www.instagram.com/s.erg2/" target="_blank" rel="noreferrer" aria-label="Instagram">
            <i class="bi bi-instagram" aria-hidden="true"></i>
          </a>
          <a class="hero-icon-link" href="https://www.linkedin.com/in/aparri-serg/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
            <i class="bi bi-linkedin" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="landing-hero__visual reveal">
      <div class="floating-card floating-card--badge">
        <span class="floating-card__label">UI/UX</span>
        <i class="bi bi-sparkles" aria-hidden="true"></i>
      </div>

      <div class="floating-card floating-card--quote">
        <span>Designing meaningful experiences</span>
      </div>

      <div class="landing-hero__portrait-stage">
        <img
          class="landing-hero__portrait"
          src="assets/images/NOBG%20PORTRAIT.png"
          alt="Portrait illustration of Serg"
        />
      </div>
    </div>
  </div>
</section>
