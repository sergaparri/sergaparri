<section id="contact" class="section">
  <div class="section-heading reveal">
    <p class="eyebrow">Contact</p>
    <h2>Reach out for internships, freelance work, or collaboration.</h2>
  </div>

  <div class="contact-grid">
    <form class="panel contact-form reveal" id="contact-form">
      <label>
        Name
        <input type="text" name="name" placeholder="Your name" required />
      </label>
      <label>
        Email
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <label>
        Subject
        <input type="text" name="subject" placeholder="Project inquiry" required />
      </label>
      <label>
        Message
        <textarea name="message" rows="5" placeholder="Tell me about your project or opportunity..." required></textarea>
      </label>
      <button class="button button-primary" type="submit">Send Message</button>
      <p class="form-status" id="contact-status" role="status" aria-live="polite"></p>
      <p class="form-note">This form sends directly through EmailJS with no backend required.</p>
    </form>

    <article class="panel reveal">
      <h3>Find Me Online</h3>
      <p>These links go to my current public profiles.</p>
      <div class="contact-links">
        <a class="icon-link" href="https://github.com/sergaparri" target="_blank" rel="noreferrer" aria-label="GitHub">
          <i class="bi bi-github" aria-hidden="true"></i>
        </a>
        <a class="icon-link" href="https://www.facebook.com/sergmichael.aparri" target="_blank" rel="noreferrer" aria-label="Facebook">
          <i class="bi bi-facebook" aria-hidden="true"></i>
        </a>
        <a class="icon-link" href="https://www.instagram.com/s.erg2/" target="_blank" rel="noreferrer" aria-label="Instagram">
          <i class="bi bi-instagram" aria-hidden="true"></i>
        </a>
        <a class="icon-link" href="https://www.linkedin.com/in/aparri-serg/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
          <i class="bi bi-linkedin" aria-hidden="true"></i>
        </a>
      </div>
    </article>
  </div>
</section>
